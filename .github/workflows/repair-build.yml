name: Fusion safety validation

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Run lifecycle simulation harness
        shell: pwsh
        run: dotnet run --project .\tools\FusionSafetyHarness\FusionSafetyHarness.csproj -c Release --nologo

      - name: Audit forbidden in-process Steam shutdown paths
        shell: pwsh
        run: |
          $source = (Get-ChildItem .\LabFusion\src -Recurse -Filter *.cs | ForEach-Object {
            Get-Content -Raw -LiteralPath $_.FullName
          }) -join "`n"
          $forbidden = @(
            'Il2CppSteamworks.SteamClient.Shutdown',
            'SteamClient.Shutdown()',
            'SteamAPI.Shutdown()'
          )
          foreach ($call in $forbidden) {
            if ($source.Contains($call)) { throw "Forbidden Steam shutdown path found: $call" }
          }

      # LabFusion itself intentionally builds only against a real BONELAB/MelonLoader
      # installation via BONELAB_DIR. Public runners do not contain or redistribute
      # those game assemblies; release builds are produced locally with the guarded
      # tools/BuildAndReleaseRepair.ps1 workflow.
