name: Sync Proxy V2

on:
  push:
    branches:
      - temp/helper-fetch
    paths:
      - .github/patches/proxy-v2.cs.gz.b64
      - .github/workflows/sync-proxy-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode exact verified source
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin temp/helper-fetch
          git show origin/temp/helper-fetch:.github/patches/proxy-v2.cs.gz.b64 \
            | base64 -d \
            | gunzip \
            > LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          echo '2c90c45d661ff27d286e799e723c5841cbb5bca18a6e52fd73131a6e62296db9  LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs' | sha256sum -c -
          grep -q 'TryStartLocalFusionHelper(int port)' LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          grep -q 'Fusion Helper is required for crash-safe SteamVR networking on PC' LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs

      - name: Commit to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          if git diff --cached --quiet; then
            echo 'main already has the exact source'
            exit 0
          fi
          git commit -m 'Fix desktop Helper login handshake'
          git push origin HEAD:main
