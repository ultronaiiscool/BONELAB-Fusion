name: Apply proxy login fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/patches/proxy-login-fix.patch'
      - '.github/workflows/apply-proxy-login-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage proxy login repair')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore clean proxy source and apply verified patch
        shell: bash
        run: |
          set -euxo pipefail
          git checkout 9f31a7f6aaac1d3a2148ef45912a090ef79b8282 -- LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          git apply .github/patches/proxy-login-fix.patch
          grep -q 'EventBasedNetListener listener = new();' LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          ! grep -q 'EventBasedNetFistener' LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs

      - name: Commit corrected proxy source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LabFusion/src/Network/Layers/Proxy/ProxyNetworkLayer.cs
          git commit -m 'Fix desktop proxy login source'
          git push origin HEAD:main
