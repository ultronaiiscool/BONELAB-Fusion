name: Export Offline Build Kit

on:
  push:
    branches:
      - fix/steam-lifecycle-token-integration
    paths:
      - .github/workflows/export-offline-build-kit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install isolated .NET 6 SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/offline-dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 6.0.428 --install-dir "$RUNNER_TEMP/offline-dotnet"
          "$RUNNER_TEMP/offline-dotnet/dotnet" --info

      - name: Restore Fusion NuGet packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$RUNNER_TEMP/offline-dotnet:$PATH"
          dotnet restore LabFusion/LabFusion.csproj

      - name: Prepare split offline build kit
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/offline-source" "$RUNNER_TEMP/offline-sdk" "$RUNNER_TEMP/offline-nuget"
          mkdir -p "$RUNNER_TEMP/offline-source/source" "$RUNNER_TEMP/offline-sdk/dotnet" "$RUNNER_TEMP/offline-nuget/nuget-packages"
          rsync -a --exclude='.git' ./ "$RUNNER_TEMP/offline-source/source/"
          printf '%s\n' "${GITHUB_SHA}" > "$RUNNER_TEMP/offline-source/COMMIT_SHA.txt"
          rsync -a "$RUNNER_TEMP/offline-dotnet/" "$RUNNER_TEMP/offline-sdk/dotnet/"
          rsync -a "$HOME/.nuget/packages/" "$RUNNER_TEMP/offline-nuget/nuget-packages/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/fusion-source.tar.gz" offline-source
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dotnet6-sdk.tar.gz" offline-sdk
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/nuget-cache.tar.gz" offline-nuget
          ls -lh "$RUNNER_TEMP/fusion-source.tar.gz" "$RUNNER_TEMP/dotnet6-sdk.tar.gz" "$RUNNER_TEMP/nuget-cache.tar.gz"

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: fusion-offline-source
          path: ${{ runner.temp }}/fusion-source.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: fusion-offline-dotnet6
          path: ${{ runner.temp }}/dotnet6-sdk.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload NuGet cache
        uses: actions/upload-artifact@v4
        with:
          name: fusion-offline-nuget
          path: ${{ runner.temp }}/nuget-cache.tar.gz
          compression-level: 0
          retention-days: 1
